<!-- ============================================================================
     SINGLE SOURCE OF TRUTH for the site header.
     dashboard.html, company-info-directory.html and
     restaurant-details-directory.html each carry their own copy of the
     <header>...</header> block below (between HEADER:START/HEADER:END
     comments) baked directly into their markup — not loaded at runtime —
     so the header displays identically whether a page is opened by
     double-clicking the file or served from a real web server.

     TO CHANGE THE HEADER: edit the block between HEADER:START and
     HEADER:END below, then run sync-header.ps1 in this folder. It copies
     this exact block into the matching markers in every page, so they
     stay byte-for-byte identical:

         powershell -ExecutionPolicy Bypass -File sync-header.ps1

     This file itself is never loaded by the other pages — it's only the
     editable master copy the sync script reads from.
     ============================================================================ -->

<script>
  (function () {
    var btn = document.getElementById('profileMenuBtn');
    var menu = document.getElementById('profileMenu');
    if (!btn || !menu) return;
    document.addEventListener('click', function (e) {
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  function getCookie(name) {
    var match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? decodeURIComponent(match[2]) : null;
  }

  function handleLogout(event) {
    event.preventDefault();
    // Django's CSRF protection requires this header on state-changing
    // requests; the csrftoken cookie is deliberately readable by JS (unlike
    // the HttpOnly session cookie) so it can be echoed back this way.
    fetch('/api/logout/', {
      method: 'POST',
      credentials: 'include',
      headers: { 'X-CSRFToken': getCookie('csrftoken') || '' },
    })
      .catch(function () {})
      .then(function () {
        window.location.href = 'index.html';
      });
  }
</script>
