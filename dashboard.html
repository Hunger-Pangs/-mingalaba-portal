  @layer base {
    html, body { margin: 0; padding: 0; }
    body { overscroll-behavior: none; }
    main > :first-child { margin-top: 0 !important; }
    main > :last-child { margin-bottom: 0 !important; }
  }
  ::-webkit-scrollbar { display: none; }

  /* Entrance animation on page load -- kept identical across dashboard.html,
     company-info-directory.html and restaurant-details-directory.html so
     arriving at any of them feels the same. */
  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(10px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  #pageContent {
    animation: pageFadeIn 0.5s ease-out both;
  }
  @media (prefers-reduced-motion: reduce) {
    #pageContent { animation: none; }
  }

  /* Simple icon tiles -- same look as the other icon-grid pages (Knowledge
     Center, Log Book): hover background/border change and a small icon
     scale, nothing more. */
  .kc-tile { transition: background-color .15s, border-color .15s, box-shadow .15s; }
  .kc-ic { transition: transform .2s ease; }
  .kc-tile:hover .kc-ic, .kc-tile:focus-visible .kc-ic { transform: scale(1.06); }
  .kc-tile:focus-visible { outline: 3px solid var(--tint-solid, #5b1614); outline-offset: 2px; }
</style>

<script>
  (function () {
    var btn = document.getElementById('profileMenuBtn');
    var menu = document.getElementById('profileMenu');
    if (!btn || !menu) return;
    document.addEventListener('click', function (e) {
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  function getCookie(name) {
    var match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? decodeURIComponent(match[2]) : null;
  }

  function handleLogout(event) {
    event.preventDefault();
    // Django's CSRF protection requires this header on state-changing
    // requests; the csrftoken cookie is deliberately readable by JS (unlike
    // the HttpOnly session cookie) so it can be echoed back this way.
    fetch('/api/logout/', {
      method: 'POST',
      credentials: 'include',
      headers: { 'X-CSRFToken': getCookie('csrftoken') || '' },
    })
      .catch(function () {})
      .then(function () {
        window.location.href = 'index.html';
      });
  }
</script>

<script>
  // Time-of-day greeting for the welcome note. Falls back silently if the profile name ever moves.
  (function () {
    var el = document.getElementById('welcomeGreeting');
    if (!el) return;
    var name = 'Sarah Jenkins'.split(' ')[0]; // first name only, matches the profile shown in the header
    var hour = new Date().getHours();
    var part = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    el.textContent = part + ', ' + name;
  })();
</script>
