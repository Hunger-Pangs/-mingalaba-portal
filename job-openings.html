<style>
  @layer base {
    html, body { margin: 0; padding: 0; }
    body { overscroll-behavior: none; }
    main > :first-child { margin-top: 0 !important; }
    main > :last-child { margin-bottom: 0 !important; }
  }
  ::-webkit-scrollbar { display: none; }

  /* Entrance animation on page load -- kept identical across /dashboard/,
     /sop-policies/, /restaurants/ and this
     page so arriving at any of them feels the same. */
  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(10px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  #pageContent {
    animation: pageFadeIn 0.5s ease-out both;
  }
  @media (prefers-reduced-motion: reduce) {
    #pageContent { animation: none; }
  }

  /* Department-filtered cards: hidden cards collapse out of the grid
     entirely rather than just being invisible, so the layout re-flows. */
  .checklist-card[hidden] { display: none; }

  /* Tailwind's flex/grid utilities would otherwise override the hidden attribute. */
  [hidden] { display: none !important; }

  /* ---- Job Openings: list + detail ---- */
  .jo-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .jo-pill .material-symbols-outlined { font-size: 13px; }
  .jo-new { background: #FFE9A8; color: #5b1614; }
  .jo-urgent { background: #fdeaea; color: #ba1a1a; }
  .jo-circ { border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
  .jo-meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: #635654; }
  .jo-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .jo-meta .material-symbols-outlined { font-size: 15px; }
  .jo-count { display: inline-flex; align-items: center; font-weight: 700; font-size: 12px; color: #78350F; background: #FEF8EB; border: 1px solid #FDE5B5; border-radius: 99px; padding: 2px 10px; white-space: nowrap; }

  .jo-search { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #E8DFD3; border-radius: 999px; padding: 6px 14px; min-width: 230px; }
  .jo-search input { border: 0; outline: 0; box-shadow: none; font: inherit; font-size: 13px; flex: 1; background: transparent; min-width: 0; padding: 0; }
  .jo-search input:focus { box-shadow: none; }
  .jo-select { font: inherit; font-size: 12px; font-weight: 600; padding: 7px 32px 7px 14px; border-radius: 999px; border: 1px solid #E8DFD3; background-color: #fff; color: #635654; cursor: pointer; }

  /* Slim list (about 42%) so the detail panel (about 58%) gets most of the space. */
  .jo-split { display: grid; grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
  .jo-list { background: #fff; border: 1px solid #E8DFD3; border-radius: 20px; overflow: hidden; max-height: calc(100vh - 150px); overflow-y: auto; }
  .jo-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #F0EBE0; border-left: 4px solid transparent; cursor: pointer; transition: background-color .12s; outline: none; }
  .jo-item:last-child { border-bottom: 0; }
  .jo-item:hover { background: #FCFAF6; }
  .jo-item:focus-visible { box-shadow: inset 0 0 0 2px #B45309; }
  .jo-item.sel { background: #FEF8EB; border-left-color: #B45309; }
  .jo-item .tx { min-width: 0; flex: 1; }
  .jo-item .t1 { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; min-width: 0; }
  .jo-item .t1 b { font-family: 'Noto Serif', Georgia, serif; font-size: 14px; font-weight: 600; line-height: 1.3; color: #231917; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jo-item .t1 .jo-pill { flex: none; padding: 1px 8px; font-size: 10.5px; }
  .jo-item .jo-meta { margin-top: 0; font-size: 11px; gap: 0 8px; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
  .jo-item .jo-meta .dn { font-weight: 700; flex: none; }
  .jo-item .jo-meta .loc { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; }
  .jo-item .jo-meta .material-symbols-outlined { font-size: 13px; vertical-align: -2px; }
  .jo-item .side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; flex: none; }
  .jo-item .jo-count { padding: 1px 8px; font-size: 11px; }

  .jo-detail { position: sticky; top: 84px; background: #fff; border: 1px solid #E8DFD3; border-radius: 20px; padding: 28px 30px 26px; max-height: calc(100vh - 104px); overflow-y: auto; }
  .jo-detail h2 { font-family: 'Noto Serif', Georgia, serif; font-size: 25px; font-weight: 600; line-height: 1.25; margin: 12px 0 8px; color: #231917; }
  .jo-detail h4 { margin: 22px 0 8px; font-family: 'Noto Serif', Georgia, serif; font-size: 16px; font-weight: 600; color: #231917; }

<script>
  (function () {
    var btn = document.getElementById('profileMenuBtn');
    var menu = document.getElementById('profileMenu');
    if (!btn || !menu) return;
    document.addEventListener('click', function (e) {
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  function getCookie(name) {
    var match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? decodeURIComponent(match[2]) : null;
  }

  function handleLogout(event) {
    event.preventDefault();
    // Django's CSRF protection requires this header on state-changing
    // requests; the csrftoken cookie is deliberately readable by JS (unlike
    // the HttpOnly session cookie) so it can be echoed back this way.
    fetch('/api/logout/', {
      method: 'POST',
      credentials: 'include',
      headers: { 'X-CSRFToken': getCookie('csrftoken') || '' },
    })
      .catch(function () {})
      .then(function () {
        window.location.href = 'dashboard.html';
      });
  }
</script>

<script>
  // The bell: asks /api/notifications/ now and every 2 minutes (only while the tab is in view).
  (function () {
    var URL_ = "/api/notifications/";
    var btn = document.getElementById('notifBtn'), panel = document.getElementById('notifPanel');
    var badge = document.getElementById('notifBadge'), list = document.getElementById('notifList');
    var allRead = document.getElementById('notifAllRead');
    if (!btn || !panel) return;
    var items = [];
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    function when(iso) {
      var d = new Date(iso + 'T00:00:00'), t = new Date(); t.setHours(0, 0, 0, 0);
      var days = Math.round((t - d) / 86400000);
      if (days <= 0) return 'Today';
      if (days === 1) return 'Yesterday';
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }
    // "View all ..." only for the pages this person may open.
    var PAGES = { announcements: ['announcements.html', 'View all announcements'],
                  jobs: ['job-openings.html', 'View all job openings'] };
    function drawFoot(can) {
      var foot = document.getElementById('notifFoot');
      var links = Object.keys(PAGES).filter(function (k) { return can && can[k]; }).map(function (k) {
        return '<a href="' + PAGES[k][0] + '">' + PAGES[k][1] + '</a>';
      });
      foot.innerHTML = links.join(' &middot; ');
      foot.hidden = !links.length;
    }
    function draw(data) {
      drawFoot(data && data.can);
      items = (data && data.items) || [];
      var n = items.length;
      badge.textContent = n > 9 ? '9+' : String(n);
      badge.hidden = n === 0;
      btn.setAttribute('aria-label', n ? 'Notifications, ' + n + ' unread' : 'Notifications');
      allRead.disabled = n === 0;
      if (!n) {
        list.innerHTML = '<div class="nf-empty"><span class="material-symbols-outlined">task_alt</span><b>You\'re all caught up</b>New announcements and job openings will show here.</div>';
        return;
      }
      list.innerHTML = items.map(function (it, i) {
        var ann = it.type === 'announcement';
        var tag = it.important ? '<span class="nf-tag ' + (ann ? 'nf-imp">Important' : 'nf-urg">Urgent') + '</span>' : '';
        return '<a class="nf-item" href="' + esc(it.url) + '" data-i="' + i + '">' +
          '<span class="nf-ic ' + (ann ? 'nf-ann' : 'nf-job') + '"><span class="material-symbols-outlined">' + (ann ? 'campaign' : 'work') + '</span></span>' +
          '<span><span class="nf-title" style="display:block">' + (ann ? 'New announcement: ' : 'New job opening: ') + esc(it.title) + '</span>' +
          '<span class="nf-sum" style="display:block">' + esc(it.summary) + '</span>' +
          '<span class="nf-meta">' + tag + (ann ? 'Announcements' : 'Job Openings') + ' &middot; ' + when(it.date) + '</span></span></a>';
      }).join('');
    }
    function send(body) {
      return fetch(URL_, { method: 'POST', credentials: 'include', keepalive: true,
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': (typeof getCookie === 'function' && getCookie('csrftoken')) || '' },
        body: JSON.stringify(body) }).then(function (r) { return r.ok ? r.json() : null; });
    }
    function refresh() {
      fetch(URL_, { credentials: 'include', cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { if (d) draw(d); }).catch(function () {});
    }
    function open(on) {
      panel.hidden = !on; btn.setAttribute('aria-expanded', on ? 'true' : 'false');
      if (on) refresh();
    }
    btn.addEventListener('click', function (e) { e.stopPropagation(); open(panel.hidden); });
    panel.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', function () { if (!panel.hidden) open(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) { open(false); btn.focus(); } });
    // Clicking one: mark it read for this person, then open its page in this same window.
    list.addEventListener('click', function (e) {
      var a = e.target.closest('.nf-item'); if (!a) return;
      e.preventDefault();
      var it = items[+a.getAttribute('data-i')];
      var go = function () { window.location.href = it.url; };
      send({ key: it.key }).then(go, go);
    });
    allRead.addEventListener('click', function () { send({ all: true }).then(function (d) { if (d) draw(d); }).catch(function () {}); });
    refresh();
    setInterval(function () { if (!document.hidden) refresh(); }, 120000);
  })();
</script>

<main id="pageContent" class="w-full pt-16 bg-background min-h-screen px-space-xl py-space-lg max-w-app-max-width mx-auto">

<span class="material-symbols-outlined text-[16px]">dashboard</span>
<span>Dashboard</span>
</a>

<!-- Page Header -->
<div class="bg-[#FEF8EB] border border-[#FDE5B5] rounded-2xl p-space-xl flex flex-col md:flex-row md:items-center justify-between gap-space-lg">
<div class="flex items-center gap-space-md">
<div class="w-14 h-14 shrink-0 rounded-full bg-[#B45309] text-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[28px]">badge</span>
</div>
<div>
<h1 class="text-[22px] font-serif font-semibold text-[#78350F] tracking-tight">Job Openings</h1>
<p class="text-[13px] font-sans text-on-surface-variant mt-1 max-w-xl">Open positions in every department. Pick a role to see the details and how to apply.</p>
</div>
</div>
<div class="flex flex-wrap items-center gap-space-sm">

<span class="material-symbols-outlined text-[16px]">edit_note</span>Manage postings

<script src="jobs-data.js"></script>
<script>
  (function () {
    var S = window.JobsStore;
    var jobs = [], canManage = false;
    var dept = 'All', city = 'All cities', query = '', selId = null;

    var PILL_BASE = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-sans font-semibold border transition-colors cursor-pointer ';
    var PILL_ON = 'bg-primary text-white border-primary';
    var PILL_OFF = 'bg-white text-on-surface-variant border-[#E8DFD3] hover:bg-[#F7F4EE] hover:text-primary';

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
    }
    function icon(name) { return '<span class="material-symbols-outlined">' + name + '</span>'; }
    function fmtDate(iso) { return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
    function ageText(job) {
      var d = S.daysSince(job.postedAt);
      if (d === null) return '';
      return d <= 0 ? 'Posted today' : d === 1 ? 'Posted yesterday' : 'Posted ' + d + ' days ago';
    }
    function isNew(job) { var d = S.daysSince(job.postedAt); return d !== null && d <= 7; }
    function where(job) { return job.place ? job.city + ' · ' + job.place : job.city; }
    function openingsText(job) { return job.openings + (job.openings > 1 ? ' openings' : ' opening'); }
    function pills(job) {
      return (job.urgent ? '<span class="jo-pill jo-urgent">' + icon('bolt') + 'Urgent</span>' : '') + (isNew(job) ? '<span class="jo-pill jo-new">New</span>' : '');
    }
    function deptCircle(name, size, isz) {
      var st = S.deptStyle(name);
      return '<span class="jo-circ" style="width:' + size + 'px;height:' + size + 'px;background:' + st.color + '"><span class="material-symbols-outlined" style="font-size:' + isz + 'px">' + st.icon + '</span></span>';
    }
    function liveJobs() { return jobs.filter(S.isLive); }
    function visible() {
      var q = query.trim().toLowerCase();
      return liveJobs().filter(function (j) {
        return (dept === 'All' || j.department === dept) && (city === 'All cities' || j.city === city) &&
          (!q || (j.title + ' ' + j.city + ' ' + j.place + ' ' + j.department).toLowerCase().indexOf(q) >= 0);
      }).sort(function (a, b) {
        return (b.urgent - a.urgent) || ((S.daysSince(a.postedAt) || 0) - (S.daysSince(b.postedAt) || 0));
      });
    }

    function renderFilters() {
      var live = liveJobs();
      var names = ['All'].concat(Object.keys(S.DEPTS).filter(function (n) { return live.some(function (j) { return j.department === n; }); }));
      live.forEach(function (j) { if (names.indexOf(j.department) < 0) names.push(j.department); });
      if (names.indexOf(dept) < 0) dept = 'All';
      document.getElementById('deptFilters').innerHTML = names.map(function (n) {
        var count = n === 'All' ? live.length : live.filter(function (j) { return j.department === n; }).length;
        var on = n === dept;
        return '<button type="button" data-dept="' + esc(n) + '" aria-pressed="' + on + '" class="' + PILL_BASE + (on ? PILL_ON : PILL_OFF) + '"><span>' + esc(n) + '</span>' +
          '<span class="text-[10px] px-1.5 py-0.5 rounded-full ' + (on ? 'bg-white/20' : 'bg-[#F4EFE6]') + '">' + count + '</span></button>';
      }).join('');
      var cities = ['All cities'].concat(live.map(function (j) { return j.city; }).filter(function (c, i, a) { return a.indexOf(c) === i; }).sort());
      if (cities.indexOf(city) < 0) city = 'All cities';
      document.getElementById('cityFilter').innerHTML = cities.map(function (c) { return '<option' + (c === city ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
      var positions = live.reduce(function (n, j) { return n + j.openings; }, 0);
      document.getElementById('openSummary').textContent = live.length + (live.length === 1 ? ' open role' : ' open roles') + ' · ' + positions + (positions === 1 ? ' position' : ' positions');
    }

    function renderList() {
      var list = visible(), box = document.getElementById('jobList');
      if (!list.length) {
        box.innerHTML = '<div class="jo-empty">' + (liveJobs().length ? 'No roles match your search.' : 'There are no open positions right now. Please check back soon.') + '</div>';
        selId = null;
        renderDetail(null);
        return;
      }
      if (!list.some(function (j) { return j.id === selId; })) selId = list[0].id;
      box.innerHTML = list.map(function (j) {
        var st = S.deptStyle(j.department);
        return '<div class="jo-item' + (j.id === selId ? ' sel' : '') + '" role="option" tabindex="0" aria-selected="' + (j.id === selId) + '" data-id="' + j.id + '">' +
          deptCircle(j.department, 34, 18) +
          '<div class="tx"><div class="t1"><b title="' + esc(j.title) + '">' + esc(j.title) + '</b>' + pills(j) + '</div>' +
          '<div class="jo-meta"><span class="dn" style="color:' + st.color + '">' + esc(j.department) + '</span><span class="loc" title="' + esc(where(j)) + '">' + icon('location_on') + esc(where(j)) + '</span></div></div>' +
          '<div class="side"><span class="jo-count">' + openingsText(j) + '</span></div></div>';
      }).join('');
      renderDetail(list.filter(function (j) { return j.id === selId; })[0]);
    }

    function renderDetail(j) {
      var box = document.getElementById('jobDetail');
      if (!j) { box.innerHTML = '<div class="jo-empty">Select a role to see its details.</div>'; return; }
      var st = S.deptStyle(j.department);
      var apply = '<a class="jo-btn" href="job-application.html?job=' + j.id + '">' + icon('send') + 'Apply</a>';
      box.innerHTML = '<button type="button" class="jo-close" data-close aria-label="Back to the list">' + icon('close') + '</button>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-right:40px"><span class="jo-pill" style="background:' + st.tint + ';color:' + st.color + '">' + esc(j.department) + '</span>' + pills(j) + '</div>' +
        '<h2>' + esc(j.title) + '</h2>' +
        '<div class="jo-meta"><span>' + icon('location_on') + esc(where(j)) + '</span>' + (ageText(j) ? '<span>' + icon('event') + esc(ageText(j)) + '</span>' : '') + '</div>' +
        '<div class="jo-facts"><div class="jo-fact"><small>Type</small><b>' + esc(j.type) + '</b></div><div class="jo-fact"><small>Experience</small><b>' + esc(j.experience || 'Not specified') + '</b></div>' +
        '<div class="jo-fact"><small>Openings</small><b>' + j.openings + '</b></div><div class="jo-fact"><small>Apply by</small><b>' + (j.closingDate ? esc(fmtDate(j.closingDate)) : 'Open until filled') + '</b></div></div>' +
        (j.summary ? '<h4>About the role</h4><p>' + esc(j.summary) + '</p>' : '') +
        (j.requirements.length ? '<h4>What we are looking for</h4><ul>' + j.requirements.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' : '') +
        '<div class="jo-acts">' + apply + '<button type="button" class="jo-btn ghost" data-copy>' + icon('link') + '<span>Copy link</span></button></div>';
    }

    function select(id, openSheet) {
      selId = id;
      [].forEach.call(document.querySelectorAll('.jo-item'), function (el) {
        var on = +el.getAttribute('data-id') === id;
        el.classList.toggle('sel', on);
        el.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      renderDetail(jobs.filter(function (j) { return j.id === id; })[0]);
      if (openSheet) document.getElementById('jobSplit').classList.add('show-detail');
      try { history.replaceState(null, '', '#job-' + id); } catch (e) { /* not critical */ }
    }

    function renderAll() { renderFilters(); renderList(); }

    /* ---- events ---- */
    document.getElementById('deptFilters').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-dept]'); if (!b) return;
      dept = b.getAttribute('data-dept'); renderAll();
    });
    document.getElementById('cityFilter').addEventListener('change', function () { city = this.value; renderList(); });
    document.getElementById('jobSearch').addEventListener('input', function () { query = this.value; renderList(); });
    document.getElementById('jobList').addEventListener('click', function (e) {
      var it = e.target.closest('.jo-item'); if (it) select(+it.getAttribute('data-id'), true);
    });
    document.getElementById('jobList').addEventListener('keydown', function (e) {
      var it = e.target.closest('.jo-item');
      if (it && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(+it.getAttribute('data-id'), true); }
    });
    document.getElementById('jobDetail').addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) { document.getElementById('jobSplit').classList.remove('show-detail'); return; }
      var c = e.target.closest('[data-copy]'); if (!c) return;
      var url = location.origin + location.pathname + '#job-' + selId, label = c.querySelector('span:last-child');
      function done() { label.textContent = 'Link copied'; setTimeout(function () { label.textContent = 'Copy link'; }, 1800); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { window.prompt('Copy this link:', url); });
      else window.prompt('Copy this link:', url);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') document.getElementById('jobSplit').classList.remove('show-detail');
    });
    // A #job-<id> link pasted or navigated to while the page is already open.
    window.addEventListener('hashchange', function () {
      var m = location.hash.match(/^#job-(\d+)$/);
      if (m && +m[1] !== selId && visible().some(function (j) { return j.id === +m[1]; })) select(+m[1], false);
    });

    /* ---- load ---- */
    document.getElementById('jobDetail').innerHTML = '';
    document.getElementById('jobList').innerHTML = '<div class="jo-empty">Loading job openings…</div>';
    S.load().then(function (data) {
      jobs = data.jobs; canManage = data.canManage;
      document.getElementById('manageLink').hidden = !canManage;
      var m = location.hash.match(/^#job-(\d+)$/);
      if (m) selId = +m[1];
      renderAll();
    }).catch(function (err) {
      document.getElementById('jobList').innerHTML = '<div class="jo-empty">Could not load the job openings. ' + esc(err.message || '') + '</div>';
    });
  })();
</script>
