<style>
  @layer base {
    html, body { margin: 0; padding: 0; }
    body { overscroll-behavior: none; }
    main > :first-child { margin-top: 0 !important; }
    main > :last-child { margin-bottom: 0 !important; }
  }
  ::-webkit-scrollbar { display: none; }
  /* Tailwind's flex/grid utilities would otherwise override the hidden attribute. */
  [hidden] { display: none !important; }

  /* Entrance animation on page load -- kept identical across /dashboard/,
     /sop-policies/, /restaurants/ and this
     page so arriving at any of them feels the same. */
  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(10px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  #pageContent {
    animation: pageFadeIn 0.5s ease-out both;
  }
  @media (prefers-reduced-motion: reduce) {
    #pageContent { animation: none; }
  }

  /* ---- Announcements notice board ---- */
  /* Cork board with a wooden frame. */
  .nb-board {
    position: relative; border-radius: 28px; padding: 38px 34px 52px;
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 34px 30px; align-items: start;
    background-color: #C8A06A; border: 10px solid #7a4d2b; box-shadow: inset 0 0 40px rgba(60,30,10,.35);
    background-image: radial-gradient(rgba(90,55,25,.28) 1.2px, transparent 1.5px), radial-gradient(rgba(255,235,200,.22) 1.4px, transparent 1.7px);
    background-size: 14px 14px, 23px 23px; background-position: 0 0, 7px 9px;
  }
  /* A note is a tilted wrapper (drop shadow) around a paper (clipped for the folded corner). */
  .nb-note {
    position: relative; transform: rotate(var(--r, 0deg)); transform-origin: 50% 8%; margin-top: var(--dy, 0);
    filter: drop-shadow(0 3px 3px rgba(60,35,15,.22)) drop-shadow(0 12px 14px rgba(60,35,15,.12));
    transition: transform .22s cubic-bezier(.2,.8,.3,1), filter .22s, opacity .2s; cursor: pointer; outline: none;
  }
  .nb-note:hover, .nb-note:focus-visible {
    transform: rotate(0deg) translateY(-6px) scale(1.025); z-index: 5;
    filter: drop-shadow(0 4px 4px rgba(60,35,15,.22)) drop-shadow(0 22px 22px rgba(60,35,15,.2));
  }
  .nb-note:focus-visible .nb-paper { outline: 3px solid #5B2C6F; outline-offset: 2px; }
  .nb-note.dim { opacity: .22; transform: rotate(var(--r, 0deg)) scale(.96); pointer-events: none; }
  .nb-paper {
    position: relative; background-color: var(--paper, #fff); padding: 26px 22px 22px; border-radius: 3px; overflow: hidden;
    background-image: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 40%);
  }
  .nb-fold-br .nb-paper { padding-bottom: 30px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%); }
  .nb-fold-br .nb-paper::after {
    content: ''; position: absolute; right: 0; bottom: 0; width: 30px; height: 30px;
    background: linear-gradient(135deg, var(--fold, #d9cdb6) 0%, #f4ecdc 50%, transparent 50%); box-shadow: -2px -2px 4px rgba(60,35,15,.12);
  }
  .nb-fold-tr .nb-paper { clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 0 100%); }
  .nb-fold-tr .nb-paper::after {
    content: ''; position: absolute; right: 0; top: 0; width: 30px; height: 30px;
    background: linear-gradient(45deg, var(--fold, #d9cdb6) 0%, #f4ecdc 50%, transparent 50%);
  }
  .nb-pin {
    position: absolute; top: -9px; left: 50%; margin-left: -11px; width: 22px; height: 22px; border-radius: 50%; z-index: 2;
    background: radial-gradient(circle at 34% 30%, #fff 0 12%, var(--pin) 14% 70%, rgba(0,0,0,.35) 100%); box-shadow: 0 5px 5px rgba(0,0,0,.28);
  }
  .nb-tape {
    position: absolute; top: -12px; left: 50%; width: 84px; height: 24px; margin-left: -42px; transform: rotate(var(--tr, -3deg)); z-index: 2;
    background: rgba(238,226,190,.82); box-shadow: 0 1px 3px rgba(0,0,0,.15);
    clip-path: polygon(0 8%,4% 0,8% 10%,12% 0,16% 10%,20% 0,80% 0,84% 10%,88% 0,92% 10%,96% 0,100% 8%,100% 92%,96% 100%,92% 90%,88% 100%,84% 90%,80% 100%,20% 100%,16% 90%,12% 100%,8% 90%,4% 100%,0 92%);
  }
  /* "NEW" sticker on announcements posted in the last 10 days. */
  .nb-new {
    position: absolute; top: -16px; left: -14px; z-index: 3; width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; transform: rotate(-14deg);
    background: radial-gradient(circle at 35% 30%, #FFD65C, #E5A012); color: #5b1614;
    font-size: 11px; font-weight: 800; letter-spacing: .08em; box-shadow: 0 3px 6px rgba(60,35,15,.35), inset 0 0 0 2px rgba(255,255,255,.55);
  }
  .nb-new::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid #E5A012; opacity: 0;
    animation: nbNewPulse 2.4s ease-out infinite;
  }
  @keyframes nbNewPulse { 0% { transform: scale(.9); opacity: .8; } 70%, 100% { transform: scale(1.35); opacity: 0; } }
  .nb-catrow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .nb-circ { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
  .nb-cat { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .nb-stamp {
    margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #ba1a1a;
    border: 2px solid #ba1a1a; border-radius: 6px; padding: 1px 7px; transform: rotate(-5deg); opacity: .9; white-space: nowrap;
  }
  .nb-note h3 { margin: 0 0 8px; font-family: 'Noto Serif', Georgia, serif; font-size: 16.5px; font-weight: 600; line-height: 1.3; color: #231917; }
  .nb-note.big h3 { font-size: 23px; line-height: 1.25; }
  .nb-note p {
    margin: 0 0 12px; color: #4d4240; font-size: 13px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .nb-note.big p { font-size: 14px; -webkit-line-clamp: 4; }
  .nb-foot {
    display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: #635654; line-height: 1.5;
    border-top: 1px dashed rgba(0,0,0,.14); padding-top: 9px;
  }
  .nb-foot span { display: inline-flex; align-items: center; gap: 4px; }
  .nb-foot .material-symbols-outlined { font-size: 14px; }
  /* Reader sheet */
  .nb-ov { position: fixed; inset: 0; background: rgba(35,25,23,.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .nb-ov.on { display: flex; }
  .nb-sheet {
    position: relative; width: min(560px, 100%); max-height: 88vh; overflow: auto; background-color: var(--paper, #fff); border-radius: 6px;
    padding: 34px 30px 26px; box-shadow: 0 30px 70px rgba(0,0,0,.4); transform: rotate(-.6deg); animation: nbPop .22s ease-out;
  }
  @keyframes nbPop { from { opacity: 0; transform: rotate(-3deg) scale(.94); } to { opacity: 1; transform: rotate(-.6deg) scale(1); } }
  .nb-sheet h2 { font-family: 'Noto Serif', Georgia, serif; font-size: 22px; font-weight: 600; line-height: 1.3; margin: 6px 0 12px; color: #231917; }
  .nb-sheet p { margin: 0; color: #4d4240; font-size: 14px; line-height: 1.6; }
  .nb-sheet .nb-foot { margin-top: 16px; }
  .nb-sheet .nb-catrow { padding-right: 42px; }
  .nb-todo {
    display: flex; gap: 10px; background: rgba(255,255,255,.7); border: 1px dashed rgba(0,0,0,.25); border-radius: 12px;
    padding: 12px 14px; margin: 14px 0; font-size: 13px; color: #4d4240;
  }
  .nb-x {
    position: absolute; right: 12px; top: 12px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.07);
    cursor: pointer; display: flex; align-items: center; justify-content: center; color: #231917;
  }
  .nb-x:hover { background: rgba(0,0,0,.14); }
  .nb-empty { grid-column: 1 / -1; text-align: center; padding: 34px 20px; background: #FCFAF6; border-radius: 6px; color: #635654; font-size: 14px; box-shadow: 0 3px 8px rgba(60,35,15,.25); }
  @media (max-width: 900px) {
    .nb-board { grid-template-columns: repeat(2, 1fr); padding: 38px 18px 44px; gap: 32px 20px; }
    .nb-note { grid-column: span 1 !important; margin-top: 0 !important; }
    .nb-note.big { grid-column: 1 / -1 !important; }
  }
  @media (max-width: 560px) {
    .nb-board { grid-template-columns: 1fr; border-radius: 22px; }
    .nb-note, .nb-note.big { grid-column: 1 / -1 !important; transform: rotate(calc(var(--r, 0deg) * .6)); }
    .nb-note:hover, .nb-note:focus-visible { transform: rotate(0deg) translateY(-4px); }
    .nb-note.dim { transform: rotate(calc(var(--r, 0deg) * .6)) scale(.96); }
  }
  @media (prefers-reduced-motion: reduce) { .nb-note, .nb-note:hover { transition: none; } .nb-sheet, .nb-new::after { animation: none; } }
</style>

<script>
  (function () {
    var btn = document.getElementById('profileMenuBtn');
    var menu = document.getElementById('profileMenu');
    if (!btn || !menu) return;
    document.addEventListener('click', function (e) {
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  function getCookie(name) {
    var match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? decodeURIComponent(match[2]) : null;
  }

  function handleLogout(event) {
    event.preventDefault();
    // Django's CSRF protection requires this header on state-changing
    // requests; the csrftoken cookie is deliberately readable by JS (unlike
    // the HttpOnly session cookie) so it can be echoed back this way.
    fetch('/api/logout/', {
      method: 'POST',
      credentials: 'include',
      headers: { 'X-CSRFToken': getCookie('csrftoken') || '' },
    })
      .catch(function () {})
      .then(function () {
        window.location.href = 'dashboard.html';
      });
  }
</script>

<script>
  // The bell: asks /api/notifications/ now and every 2 minutes (only while the tab is in view).
  (function () {
    var URL_ = "/api/notifications/";
    var btn = document.getElementById('notifBtn'), panel = document.getElementById('notifPanel');
    var badge = document.getElementById('notifBadge'), list = document.getElementById('notifList');
    var allRead = document.getElementById('notifAllRead');
    if (!btn || !panel) return;
    var items = [];
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    function when(iso) {
      var d = new Date(iso + 'T00:00:00'), t = new Date(); t.setHours(0, 0, 0, 0);
      var days = Math.round((t - d) / 86400000);
      if (days <= 0) return 'Today';
      if (days === 1) return 'Yesterday';
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }
    // "View all ..." only for the pages this person may open.
    var PAGES = { announcements: ['announcements.html', 'View all announcements'],
                  jobs: ['jobs.html', 'View all job openings'] };
    function drawFoot(can) {
      var foot = document.getElementById('notifFoot');
      var links = Object.keys(PAGES).filter(function (k) { return can && can[k]; }).map(function (k) {
        return '<a href="' + PAGES[k][0] + '">' + PAGES[k][1] + '</a>';
      });
      foot.innerHTML = links.join(' &middot; ');
      foot.hidden = !links.length;
    }
    function draw(data) {
      drawFoot(data && data.can);
      items = (data && data.items) || [];
      var n = items.length;
      badge.textContent = n > 9 ? '9+' : String(n);
      badge.hidden = n === 0;
      btn.setAttribute('aria-label', n ? 'Notifications, ' + n + ' unread' : 'Notifications');
      allRead.disabled = n === 0;
      if (!n) {
        list.innerHTML = '<div class="nf-empty"><span class="material-symbols-outlined">task_alt</span><b>You\'re all caught up</b>New announcements and job openings will show here.</div>';
        return;
      }
      list.innerHTML = items.map(function (it, i) {
        var ann = it.type === 'announcement';
        var tag = it.important ? '<span class="nf-tag ' + (ann ? 'nf-imp">Important' : 'nf-urg">Urgent') + '</span>' : '';
        return '<a class="nf-item" href="' + esc(it.url) + '" data-i="' + i + '">' +
          '<span class="nf-ic ' + (ann ? 'nf-ann' : 'nf-job') + '"><span class="material-symbols-outlined">' + (ann ? 'campaign' : 'work') + '</span></span>' +
          '<span><span class="nf-title" style="display:block">' + (ann ? 'New announcement: ' : 'New job opening: ') + esc(it.title) + '</span>' +
          '<span class="nf-sum" style="display:block">' + esc(it.summary) + '</span>' +
          '<span class="nf-meta">' + tag + (ann ? 'Announcements' : 'Job Openings') + ' &middot; ' + when(it.date) + '</span></span></a>';
      }).join('');
    }
    function send(body) {
      return fetch(URL_, { method: 'POST', credentials: 'include', keepalive: true,
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': (typeof getCookie === 'function' && getCookie('csrftoken')) || '' },
        body: JSON.stringify(body) }).then(function (r) { return r.ok ? r.json() : null; });
    }
    function refresh() {
      fetch(URL_, { credentials: 'include', cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { if (d) draw(d); }).catch(function () {});
    }
    function open(on) {
      panel.hidden = !on; btn.setAttribute('aria-expanded', on ? 'true' : 'false');
      if (on) refresh();
    }
    btn.addEventListener('click', function (e) { e.stopPropagation(); open(panel.hidden); });
    panel.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', function () { if (!panel.hidden) open(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) { open(false); btn.focus(); } });
    // Clicking one: mark it read for this person, then open its page in this same window.
    list.addEventListener('click', function (e) {
      var a = e.target.closest('.nf-item'); if (!a) return;
      e.preventDefault();
      var it = items[+a.getAttribute('data-i')];
      var go = function () { window.location.href = it.url; };
      send({ key: it.key }).then(go, go);
    });
    allRead.addEventListener('click', function () { send({ all: true }).then(function (d) { if (d) draw(d); }).catch(function () {}); });
    refresh();
    setInterval(function () { if (!document.hidden) refresh(); }, 120000);
  })();
</script>

<!-- Announcement reader (outside <main> so its fade-in transform can't trap this fixed overlay) -->
<div id="annOverlay" class="nb-ov" role="dialog" aria-modal="true" aria-label="Announcement"><div id="annSheet" class="nb-sheet"></div></div>

<script src="static/portal/js/announcements-data.js"></script>
<script>
  (function () {
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Shared pill styling (same look as the Log Book filter pills).
    var PILL_BASE = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-sans font-semibold border transition-colors cursor-pointer ';
    var PILL_ON = 'bg-primary text-white border-primary';
    var PILL_OFF = 'bg-white text-on-surface-variant border-[#E8DFD3] hover:bg-[#F7F4EE] hover:text-primary';

    // color = pin / icon / label, paper = note background, fold = shade of the folded corner.
    // Defined once in announcements-data.js so this page and the Manage Announcements page agree.
    var CATS = window.AnnouncementsStore.CATS;

    // How the notes are scattered on the board, by position in the sorted list (repeats every 8).
    // span = columns out of 12, r = tilt in degrees, dy = vertical offset in px,
    // fold = folded corner (br / tr / none), hold = pin or tape. Each group of three or two spans fills a row.
    var BOARD_LAYOUT = [
      { span: 5, r: -1.6, dy: 0,  fold: 'br', hold: 'pin' },
      { span: 4, r: 2.3,  dy: 26, fold: '',   hold: 'pin' },
      { span: 3, r: -2.6, dy: 8,  fold: 'tr', hold: 'tape' },
      { span: 3, r: 1.8,  dy: 6,  fold: 'br', hold: 'pin' },
      { span: 5, r: -1.3, dy: 30, fold: '',   hold: 'tape' },
      { span: 4, r: 2.6,  dy: 0,  fold: 'tr', hold: 'pin' },
      { span: 7, r: -0.9, dy: 4,  fold: 'br', hold: 'tape' },
      { span: 5, r: 1.9,  dy: 22, fold: '',   hold: 'pin' }
    ];

    // Announcements come from announcements-data.js (browser storage now, the Django API once the
    // backend is switched on).
    var ANNOUNCEMENTS = [], SORTED_ANN = [], canManage = false;
    var annCategory = 'All';

    function fmtDate(iso) {
      var d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderAnnFilters() {
      var holder = document.getElementById('annFilters');
      var names = ['All'].concat(Object.keys(CATS));
      holder.innerHTML = names.map(function (n) {
        var count = n === 'All' ? ANNOUNCEMENTS.length : ANNOUNCEMENTS.filter(function (a) { return a.category === n; }).length;
        var active = n === annCategory;
        return '<button type="button" data-cat="' + esc(n) + '" aria-pressed="' + active + '" class="' + PILL_BASE + (active ? PILL_ON : PILL_OFF) + '">' +
          '<span>' + esc(n) + '</span><span class="text-[10px] px-1.5 py-0.5 rounded-full ' + (active ? 'bg-white/20' : 'bg-[#F4EFE6]') + '">' + count + '</span></button>';
      }).join('');
    }

    // Pinned first (important ones ahead of the rest), then newest first. The first note becomes the big one.
    function sortAnnouncements() {
      SORTED_ANN = ANNOUNCEMENTS.slice().sort(function (a, b) {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        if (a.pinned && a.important !== b.important) return a.important ? -1 : 1;
        return a.date < b.date ? 1 : (a.date > b.date ? -1 : b.id - a.id);
      });
    }

    // An announcement counts as "new" for NEW_DAYS days after the day it was posted.
    var NEW_DAYS = 10;
    function daysSince(iso) {
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((today - new Date(iso + 'T00:00:00')) / 86400000);
    }
    function isNew(a) { var d = daysSince(a.date); return d >= 0 && d <= NEW_DAYS; }
    function ageText(a) {
      var d = daysSince(a.date);
      return d === 0 ? 'Posted today' : d === 1 ? 'Posted yesterday' : 'Posted ' + d + ' days ago';
    }

    function fmtShort(iso) {
      return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }
    function icon(name) { return '<span class="material-symbols-outlined">' + name + '</span>'; }

    function noteHead(a) {
      var c = CATS[a.category];
      return '<div class="nb-catrow"><span class="nb-circ" style="background:' + c.color + '"><span class="material-symbols-outlined" style="font-size:17px">' + c.icon + '</span></span>' +
        '<span class="nb-cat" style="color:' + c.color + '">' + esc(a.category) + '</span>' + (a.important ? '<span class="nb-stamp">Important</span>' : '') + '</div>';
    }
    function noteFoot(a, dateText) {
      return '<div class="nb-foot"><span>' + icon('event') + esc(dateText) + '</span><span>' + icon('person') + esc(a.author) + '</span><span>' + icon('groups') + esc(a.audience) + '</span></div>';
    }

    function renderAnnList() {
      if (!SORTED_ANN.length) {
        document.getElementById('annList').innerHTML = '<div class="nb-empty">There are no announcements right now.</div>';
        return;
      }
      document.getElementById('annList').innerHTML = SORTED_ANN.map(function (a, i) {
        var L = BOARD_LAYOUT[i % BOARD_LAYOUT.length], c = CATS[a.category];
        var on = annCategory === 'All' || a.category === annCategory;
        var hold = L.hold === 'pin' ? '<span class="nb-pin" style="--pin:' + c.color + '"></span>' : '<span class="nb-tape" style="--tr:' + (L.r > 0 ? -4 : 4) + 'deg"></span>';
        var fresh = isNew(a);
        return '<article class="nb-note' + (L.fold ? ' nb-fold-' + L.fold : '') + (i === 0 ? ' big' : '') + (on ? '' : ' dim') + '" tabindex="' + (on ? '0' : '-1') + '" role="button"' +
          ' aria-label="Open ' + (fresh ? 'new ' : '') + 'announcement: ' + esc(a.title) + '" data-idx="' + i + '"' +
          ' style="grid-column:span ' + L.span + ';--r:' + L.r + 'deg;--dy:' + L.dy + 'px;--paper:' + c.paper + ';--fold:' + c.fold + '">' + hold +
          (fresh ? '<span class="nb-new" title="' + ageText(a) + '">NEW</span>' : '') +
          '<div class="nb-paper">' + noteHead(a) + '<h3>' + esc(a.title) + '</h3><p>' + esc(a.body) + '</p>' + noteFoot(a, fmtShort(a.date)) + '</div></article>';
      }).join('');
    }

    document.getElementById('annFilters').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-cat]');
      if (!b) return;
      annCategory = b.getAttribute('data-cat');
      renderAnnFilters();
      renderAnnList();
    });

    // Reader: click a note to read the whole announcement.
    var overlay = document.getElementById('annOverlay'), sheet = document.getElementById('annSheet'), lastFocus = null;
    function openAnn(idx) {
      var a = SORTED_ANN[idx], c = CATS[a.category];
      sheet.style.setProperty('--paper', c.paper);
      sheet.innerHTML = '<button type="button" class="nb-x" aria-label="Close">' + icon('close') + '</button>' + noteHead(a) +
        '<h2>' + esc(a.title) + '</h2><p>' + esc(a.body) + '</p>' +
        (a.action ? '<div class="nb-todo">' + icon('assignment_turned_in') + '<div><b>Action needed</b><br>' + esc(a.action) + (a.dueDate ? ' (due ' + esc(fmtShort(a.dueDate)) + ')' : '') + '</div></div>' : '') +
        noteFoot(a, fmtDate(a.date) + (isNew(a) ? ' (new)' : ''));
      lastFocus = document.activeElement;
      overlay.classList.add('on');
      document.body.style.overflow = 'hidden';
      sheet.querySelector('.nb-x').focus();
    }
    function closeAnn() {
      overlay.classList.remove('on');
      document.body.style.overflow = '';
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    var annBoard = document.getElementById('annList');
    annBoard.addEventListener('click', function (e) {
      var n = e.target.closest('.nb-note');
      if (n) openAnn(+n.getAttribute('data-idx'));
    });
    annBoard.addEventListener('keydown', function (e) {
      var n = e.target.closest('.nb-note');
      if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openAnn(+n.getAttribute('data-idx')); }
    });
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay || e.target.closest('.nb-x')) closeAnn();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('on')) closeAnn();
    });

    /* Announcements: loaded from announcements-data.js, so a notice posted on the Manage Announcements page appears here. */
    function renderAnnSummary() {
      var fresh = ANNOUNCEMENTS.filter(isNew).length, total = ANNOUNCEMENTS.length;
      var chip = '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white border border-[#E2D5F0] text-[12px] font-sans font-semibold text-[#4A235A]">' + total + (total === 1 ? ' notice' : ' notices') + '</span>' +
        (fresh ? '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[12px] font-sans font-bold text-[#5b1614]" style="background:#FFE9A8">' + fresh + ' new</span>' : '');
      var post = canManage ? '<a href="announcements-manage.html" class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-[#5B2C6F] hover:bg-[#4A235A] text-white text-[12.5px] font-sans font-bold transition-colors"><span class="material-symbols-outlined text-[16px]">edit_note</span>Post announcement</a>' : '';
      document.getElementById('annSummary').innerHTML = chip + post;
    }
    document.getElementById('annList').innerHTML = '<div class="nb-empty">Loading announcements…</div>';
    window.AnnouncementsStore.load().then(function (data) {
      ANNOUNCEMENTS = data.announcements.filter(window.AnnouncementsStore.isVisible);
      canManage = data.canManage;
      sortAnnouncements();
      renderAnnSummary();
      renderAnnFilters();
      renderAnnList();
      // Coming from the header search: ?ann=<id> opens that notice.
      var m = location.search.match(/[?&]ann=(\d+)/);
      if (m) {
        var idx = SORTED_ANN.findIndex(function (a) { return a.id === +m[1]; });
        if (idx >= 0) openAnn(idx);
      }
    }).catch(function (err) {
      document.getElementById('annList').innerHTML = '<div class="nb-empty">Could not load the announcements. ' + esc(err.message || '') + '</div>';
    });
  })();
</script>
